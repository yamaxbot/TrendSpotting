{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ТрендСкан{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/site.css' %}?v=7">
  <link rel="stylesheet" href="{% static 'css/info.css' %}?v=2">
  <link rel="stylesheet" href="{% static 'css/loading.css' %}?v=4">
</head>
<body>
